<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENSTP | حجز القاعات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif}.room{transition:.2s}.room:hover{transform:translateY(-2px)}button:disabled{opacity:.5;cursor:not-allowed}</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<header class="bg-slate-900 text-white p-5 shadow">
 <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
  <div><h1 class="text-xl md:text-2xl font-extrabold">المدرسة الوطنية العليا للأشغال العمومية</h1><p class="text-amber-300 text-sm">ENSTP — نظام حجز القاعات والمدرجات</p></div>
  <div class="flex gap-2"><button id="loginBtn" class="bg-amber-400 text-slate-900 font-bold px-4 py-2 rounded-lg" onclick="login()">تسجيل الدخول بالبريد</button><button id="logoutBtn" class="hidden bg-slate-700 px-4 py-2 rounded-lg" onclick="logout()">تسجيل الخروج</button></div>
 </div>
</header>
<main class="max-w-6xl mx-auto p-4 md:p-6 space-y-5">
 <section class="bg-white rounded-2xl p-5 shadow-sm">
  <h2 class="font-bold text-lg mb-2">حجز قاعة بسهولة</h2><p id="authStatus" class="text-sm text-slate-600">سجّل الدخول ببريدك الإلكتروني لتتمكن من الحجز وإدارة حجوزاتك.</p>
  <div id="message" class="hidden mt-3 rounded-lg p-3 text-sm" role="status"></div>
 </section>
 <section class="bg-white rounded-2xl p-4 shadow-sm grid md:grid-cols-4 gap-3">
  <label class="text-sm font-bold">التاريخ<input id="date" type="date" class="mt-1 block w-full border rounded-lg p-2"></label>
  <label class="text-sm font-bold">الفترة<select id="slot" class="mt-1 block w-full border rounded-lg p-2"><option>08:00 - 09:30</option><option>09:30 - 11:00</option><option>11:00 - 12:30</option><option>12:30 - 14:00</option><option>14:00 - 15:30</option><option>15:30 - 17:00</option></select></label>
  <label class="text-sm font-bold">المبنى<select id="building" class="mt-1 block w-full border rounded-lg p-2"><option value="all">جميع الأجنحة</option><option>Bloc A</option><option>Bloc B</option><option>Amphis</option><option>Laboratoires</option></select></label>
  <label class="text-sm font-bold">بحث<input id="search" placeholder="اسم القاعة أو السعة" class="mt-1 block w-full border rounded-lg p-2"></label>
 </section>
 <section><div class="flex justify-between items-center mb-3"><h2 class="text-lg font-extrabold">القاعات</h2><button onclick="refreshAll()" class="text-blue-700 underline text-sm">تحديث الحالة</button></div><div id="rooms" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div></section>
 <section class="bg-white rounded-2xl p-5 shadow-sm"><h2 class="text-lg font-extrabold mb-3">حجوزاتي</h2><div id="myBookings" class="space-y-3"><p class="text-slate-500 text-sm">سجّل الدخول لعرض حجوزاتك.</p></div></section>
</main>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 p-4 flex items-center justify-center">
 <form id="bookingForm" class="bg-white rounded-2xl p-5 w-full max-w-lg space-y-3">
  <div class="flex justify-between items-center"><h2 class="font-extrabold text-lg">تأكيد الحجز</h2><button type="button" onclick="closeModal()" class="text-xl">×</button></div>
  <p id="chosenRoom" class="text-sm text-slate-600"></p><input id="roomId" type="hidden">
  <label class="block text-sm font-bold">الاسم الكامل<input id="studentName" required maxlength="120" class="mt-1 w-full border rounded-lg p-2"></label>
  <label class="block text-sm font-bold">البريد الجامعي<input id="studentEmail" type="email" required placeholder="name@enstp.edu.dz" class="mt-1 w-full border rounded-lg p-2"></label>
  <label class="block text-sm font-bold">الغرض من الحجز<select id="purpose" class="mt-1 w-full border rounded-lg p-2"><option>مراجعة جماعية / Révision de groupe</option><option>تحضير مشروع PFE / Préparation PFE</option><option>ورشة تطبيقية / Atelier pratique</option><option>نشاط نادي / Activité Club</option></select></label>
  <div class="flex gap-2 justify-end"><button type="button" onclick="closeModal()" class="border rounded-lg px-4 py-2">رجوع</button><button id="submitBtn" class="bg-slate-900 text-white rounded-lg px-4 py-2 font-bold">تأكيد الحجز</button></div>
 </form>
</div>
<footer class="text-center text-xs text-slate-500 p-6">ENSTP — نظام حجز القاعات</footer>
<script>
/* 1) ضع المفتاح العام Publishable/anon من Supabase مكان النص أدناه. لا تستخدم service_role أو secret key. */
const SUPABASE_URL = 'https://edxddwblkjzhrlmmifsn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-F_OnjT0zeQiQIRB8HIsyQ_sloEMqEu';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const roomsData = [
 {id:'1',name:'Salle 01',building:'Bloc A',capacity:40,equipment:'Projecteur, tableau blanc'},
 {id:'2',name:'Salle 02',building:'Bloc A',capacity:40,equipment:'Tableau blanc'},
 {id:'3',name:'Salle 05',building:'Bloc A',capacity:35,equipment:'Projecteur, climatisation'},
 {id:'4',name:'Salle 12',building:'Bloc B',capacity:50,equipment:'Projecteur, tableau blanc'},
 {id:'5',name:'Salle 15',building:'Bloc B',capacity:45,equipment:'Tableau blanc'},
 {id:'6',name:'Amphi Francis (A1)',building:'Amphis',capacity:180,equipment:'Microphone, projecteur, climatisation'},
 {id:'7',name:'Amphi A2',building:'Amphis',capacity:150,equipment:'Microphone, projecteur'},
 {id:'8',name:'Labo Géotechnique',building:'Laboratoires',capacity:25,equipment:'Matériel de laboratoire, ordinateurs'},
 {id:'9',name:'Labo Informatique 1',building:'Laboratoires',capacity:30,equipment:'25 PC, projecteur, climatisation'}
];
let currentUser=null, publicBookings=[], myBookings=[];
const $=id=>document.getElementById(id);
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function showMessage(msg,error=false){const el=$('message');el.textContent=msg;el.className='mt-3 rounded-lg p-3 text-sm '+(error?'bg-red-100 text-red-800':'bg-emerald-100 text-emerald-800')}
function clearMessage(){ $('message').className='hidden mt-3 rounded-lg p-3 text-sm'; }
function rangeFor(date,slot){const [a,b]=slot.split(' - ');return {start:new Date(`${date}T${a}:00+01:00`).toISOString(),end:new Date(`${date}T${b}:00+01:00`).toISOString()};}
function intersects(b,date,slot){const r=rangeFor(date,slot);return new Date(b.starts_at)<new Date(r.end)&&new Date(b.ends_at)>new Date(r.start)}
function booked(room,date,slot){return publicBookings.some(b=>String(b.room_id)===room.id&&intersects(b,date,slot))}
async function refreshAll(){
 if(SUPABASE_ANON_KEY.includes('PASTE_YOUR')){showMessage('أضف مفتاح Supabase العام داخل الملف أولاً.',true);renderRooms();return}
 const {data,error}=await db.from('booking_status').select('id,room_id,room_name,building,starts_at,ends_at');
 if(error){showMessage('تعذر تحميل حالة القاعات: '+error.message,true)}else{publicBookings=data||[];clearMessage()}
 await loadMyBookings();renderRooms();
}
function renderRooms(){
 const date=$('date').value||today(),slot=$('slot').value,building=$('building').value,q=$('search').value.trim().toLowerCase();
 const list=roomsData.filter(r=>(building==='all'||r.building===building)&&(!q||r.name.toLowerCase().includes(q)||String(r.capacity).includes(q)));
 $('rooms').innerHTML=list.map(r=>{const busy=booked(r,date,slot);return `<article class="room bg-white rounded-2xl p-5 shadow-sm border ${busy?'border-red-200':'border-slate-200'}"><div class="flex justify-between gap-2"><div><span class="text-xs text-blue-700 font-bold">${r.building}</span><h3 class="font-extrabold text-lg">${r.name}</h3></div><span class="h-fit text-xs rounded-full px-3 py-1 ${busy?'bg-red-100 text-red-700':'bg-emerald-100 text-emerald-700'}">${busy?'محجوزة':'شاغرة'}</span></div><p class="text-sm text-slate-600 mt-3">السعة: ${r.capacity} شخص</p><p class="text-sm text-slate-600">التجهيزات: ${r.equipment}</p><button ${busy?'disabled':''} onclick="openModal('${r.id}')" class="mt-4 w-full rounded-lg px-4 py-2 font-bold ${busy?'bg-slate-200':'bg-slate-900 text-white'}">${busy?'محجوزة في هذه الفترة':'احجز الآن'}</button></article>`}).join('')||'<p class="text-slate-500">لا توجد نتائج.</p>';
}
async function login(){
 if(SUPABASE_ANON_KEY.includes('PASTE_YOUR'))return showMessage('أضف مفتاح Supabase العام داخل الملف أولاً.',true);
 const email=prompt('أدخل بريدك الإلكتروني لاستلام رابط تسجيل الدخول:');if(!email)return;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showMessage('البريد الإلكتروني غير صحيح.',true);
 const {error}=await db.auth.signInWithOtp({email:email.trim().toLowerCase(),options:{emailRedirectTo:location.href}});
 if(error)showMessage('فشل إرسال رابط الدخول: '+error.message,true);else showMessage('تم إرسال رابط الدخول إلى بريدك. افتح الرسالة واضغط الرابط ثم ارجع إلى الموقع.');
}
async function logout(){const {error}=await db.auth.signOut();if(error)showMessage(error.message,true);else showMessage('تم تسجيل الخروج.');}
function updateAuth(){ $('loginBtn').classList.toggle('hidden',!!currentUser);$('logoutBtn').classList.toggle('hidden',!currentUser);$('authStatus').textContent=currentUser?'تم تسجيل الدخول: '+currentUser.email:'سجّل الدخول بالبريد الإلكتروني لتتمكن من الحجز وإدارة حجوزاتك.';}
async function loadMyBookings(){
 if(!currentUser){myBookings=[];$('myBookings').innerHTML='<p class="text-slate-500 text-sm">سجّل الدخول لعرض حجوزاتك.</p>';return}
 const {data,error}=await db.from('bookings').select('id,room_id,room_name,building,booking_date,starts_at,ends_at,student_name,student_email,purpose').eq('user_id',currentUser.id).order('starts_at',{ascending:true});
 if(error){$('myBookings').textContent='تعذر تحميل حجوزاتك: '+error.message;return}
 myBookings=data||[];
 $('myBookings').innerHTML=myBookings.length?myBookings.map(b=>`<article class="border rounded-xl p-4 flex flex-wrap justify-between gap-3"><div><b>${b.room_name}</b> <span class="text-xs text-blue-700">${b.building}</span><p class="text-sm text-slate-600">${b.booking_date} — ${new Date(b.starts_at).toLocaleTimeString('fr-DZ',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Algiers'})} إلى ${new Date(b.ends_at).toLocaleTimeString('fr-DZ',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Algiers'})}</p><p class="text-sm text-slate-500">${b.purpose||''}</p></div><button onclick="cancelBooking('${b.id}')" class="bg-red-100 text-red-700 rounded-lg px-3 py-2 text-sm font-bold">إلغاء الحجز</button></article>`).join(''):'<p class="text-slate-500 text-sm">لا توجد حجوزات حالياً.</p>';
}
function openModal(id){if(!currentUser)return showMessage('سجّل الدخول أولاً قبل حجز قاعة.',true);const r=roomsData.find(x=>x.id===id);$('roomId').value=id;$('chosenRoom').textContent=`${r.name} — ${r.building} — ${$('date').value} — ${$('slot').value}`;$('studentEmail').value=currentUser.email||'';$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden')}
$('bookingForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!currentUser)return showMessage('سجّل الدخول أولاً.',true);
 const room=roomsData.find(r=>r.id===$('roomId').value),date=$('date').value,slot=$('slot').value,email=$('studentEmail').value.trim().toLowerCase();
 if(!date||date<today())return showMessage('اختر تاريخاً اليوم أو بعده.',true);
 if(email!==String(currentUser.email||'').toLowerCase())return showMessage('يجب أن يطابق البريد بريد الحساب المسجل دخوله.',true);
 const times=rangeFor(date,slot);
 $('submitBtn').disabled=true;
 try{
  await refreshAll();
  if(booked(room,date,slot))throw new Error('هذه القاعة محجوزة بالفعل في الفترة المحددة.');
  const payload={room_id:room.id,room_name:room.name,building:room.building,booking_date:date,starts_at:times.start,ends_at:times.end,student_name:$('studentName').value.trim(),student_email:email,purpose:$('purpose').value,user_id:currentUser.id};
  const {error}=await db.from('bookings').insert(payload);
  if(error){if(error.code==='23P01')throw new Error('هناك حجز آخر يتداخل مع هذه الفترة. اختر وقتاً آخر.');throw error}
  closeModal();showMessage('تم إنشاء الحجز بنجاح.');await refreshAll();
 }catch(err){showMessage('لم يتم حفظ الحجز: '+(err.message||'خطأ غير معروف'),true)}
 finally{$('submitBtn').disabled=false}
});
async function cancelBooking(id){
 if(!currentUser)return;
 if(!confirm('هل تريد إلغاء هذا الحجز؟'))return;
 const {error}=await db.from('bookings').delete().eq('id',id).eq('user_id',currentUser.id);
 if(error)showMessage('تعذر إلغاء الحجز: '+error.message,true);else{showMessage('تم إلغاء الحجز.');await refreshAll()}
}
$('date').value=today();
['date','slot','building','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderRooms));
db.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;updateAuth();await refreshAll()});
(async()=>{const {data}=await db.auth.getSession();currentUser=data.session?.user||null;updateAuth();renderRooms();if(!SUPABASE_ANON_KEY.includes('PASTE_YOUR'))await refreshAll()})();
setInterval(()=>{if(!SUPABASE_ANON_KEY.includes('PASTE_YOUR'))refreshAll()},30000);
</script>
</body></html>
